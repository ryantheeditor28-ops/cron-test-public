name: scheduler probe

# TEMPORARY: proves whether GitHub's cron scheduler fires for this ACCOUNT.
# Runs on the PUBLIC repo (free, no minutes burned). Every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: stamp
        run: echo "scheduler fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
